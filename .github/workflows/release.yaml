name: release on app update

# The app repos' prod CI pings us with a repository_dispatch after it pushes
# a v* image. We bump build.yaml + config.yaml on a staging branch, build and
# push the images, and only then move main + the tag — main is what Supervisor
# reads, so a version must never appear there before its images exist.
on:
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
    inputs:
      api_version:
        description: 'api tag, e.g. v0.1.5 (empty = keep)'
      web_version:
        description: 'web tag, e.g. v0.4.6 (empty = keep)'

# Two dispatches seconds apart both bumped to the same version and the loser's
# push was rejected, dropping its release. Queue them instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      tag: ${{ steps.bump.outputs.tag }}
    env:
      # Fixed name, force-pushed: a failed build leaves at most this one branch
      # behind, and the next run overwrites it.
      STAGING: release-staging
    steps:
      - uses: actions/checkout@v4
        # repository_dispatch pins github.sha to main as it was when the app
        # repo pinged us; a queued second dispatch would otherwise re-bump from
        # a stale main and collide with the tag the first run just pushed.
        with:
          ref: main

      - id: bump
        env:
          # Via env, not inline: the payload is attacker-shaped input.
          SRC_REPO: ${{ github.event.client_payload.repo }}
          SRC_VERSION: ${{ github.event.client_payload.version }}
          IN_API: ${{ inputs.api_version }}
          IN_WEB: ${{ inputs.web_version }}
        run: |
          set -euo pipefail
          cur_api=$(grep -oP 'API_VERSION: "\K[^"]+' lager418/build.yaml)
          cur_web=$(grep -oP 'WEB_VERSION: "\K[^"]+' lager418/build.yaml)
          api="${IN_API:-}"; web="${IN_WEB:-}"
          case "${SRC_REPO:-}" in
            lager418-api) api="${SRC_VERSION:-}" ;;
            lager418-web) web="${SRC_VERSION:-}" ;;
          esac
          api="${api:-$cur_api}"; web="${web:-$cur_web}"
          for v in "$api" "$web"; do
            [[ "$v" =~ ^v[0-9][0-9a-zA-Z.-]*$ ]] || { echo "bad version: $v"; exit 1; }
          done
          echo "api $cur_api -> $api / web $cur_web -> $web"
          if [[ "$api" == "$cur_api" && "$web" == "$cur_web" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          sed -i "s|API_VERSION: \".*\"|API_VERSION: \"$api\"|;s|WEB_VERSION: \".*\"|WEB_VERSION: \"$web\"|" lager418/build.yaml
          version=$(grep -oP '^version: "\K[^"]+' lager418/config.yaml \
            | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
          sed -i "s|^version: \".*\"|version: \"$version\"|" lager418/config.yaml
          printf '# Changelog\n\n## %s\n\n- App-Update: api %s, web %s.\n' \
            "$version" "$api" "$web" > /tmp/cl
          tail -n +2 lager418/CHANGELOG.md >> /tmp/cl
          mv /tmp/cl lager418/CHANGELOG.md

          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "chore: api $api, web $web (release $version)"
          git push --force origin "HEAD:refs/heads/$STAGING"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yaml
    with:
      publish: true
      ref: release-staging

  # Images are in the registry now, so main may advertise the version.
  promote:
    needs: [bump, build]
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        # same reason as in bump: github.sha may be a stale main
        with:
          ref: main

      - env:
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin release-staging
          sha=$(git rev-parse FETCH_HEAD)
          git tag "$TAG" "$sha"
          # ponytail: plain fast-forward — a human push to main during the
          # ~4min build makes this fail loudly, rerun the job after rebasing.
          git push origin "$sha:main" "$TAG"
          git push origin --delete release-staging
