  aarch64: ghcr.io/hassio-addons/base:21.0.8
  amd64: ghcr.io/hassio-addons/base:21.0.8
# v-prefixed: that is what the app repos' prod CI tags their images with.
args:
  API_VERSION: "v0.1.3"
  WEB_VERSION: "v0.4.4"
