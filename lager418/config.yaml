name: LAGER418
version: "0.1.67"
slug: lager418
description: Werkstatt-Inventar — Lager, Projekte, Leihe
url: https://github.com/layer418/lager418-addon
arch:
  - aarch64
  - amd64
image: ghcr.io/layer418/lager418-{arch}
# s6-overlay in the base image is PID 1; Supervisor must not inject its own init
init: false
# No ports: the UI is reachable only through HA ingress, which authenticates
# the user and passes X-Remote-User-Id / X-Remote-User-Name to the app.
ingress: true
ingress_port: 8099
panel_icon: mdi:package-variant-closed
panel_title: Lager
# Sensors + an event entity are published over MQTT discovery when a broker is
# there; 'want' means the add-on still starts without one.
services:
  - mqtt:want
# Photo exports and label PDFs land somewhere the user can actually get at.
map:
  - share:rw
# Every option a user is expected to set needs a default here: the HA UI hides
# anything that has no stored value behind "show unused optional options".
# That forces the two research URLs to be str? rather than url? below — an
# empty default goes straight into vol.Url(), which rejects "" with
# "expected a URL" and the add-on then refuses to start.
options:
  anthropic_key: ""
  jev_api_key: ""
  searxng_url: ""
  research_base_url: ""
  research_api_key: ""
  research_model: ""
  research_max_tokens: 0
  federation_enabled: false
  federation_allow_private: false
  cups_server: ""
  log_level: info
schema:
  anthropic_key: password?
  anthropic_vision_model: str?
  jev_api_key: password?
  # Part research: an OpenAI-compatible chat endpoint. SearXNG ships with the
  # add-on, so only the model options have to be set for the Recherchieren
  # button to appear; searxng_url overrides the bundled instance with your own.
  # str?, not url?: these ship with an empty default so the UI shows them, and
  # vol.Url() rejects "". The API validates what is actually entered.
  searxng_url: str?
  research_base_url: str?
  research_api_key: password?
  research_model: str?
  # 0 = no limit. int(0,) rather than int? so a typo cannot land as "unlimited".
  research_max_tokens: int(0,)?
  # Opens /api/federation/* to other hosts. base_url is required when enabled,
  # the API refuses to boot otherwise.
  federation_enabled: bool
  federation_base_url: url?
  federation_allow_private: bool
  # Netzwerk-CUPS mit dem Etikettendrucker, z.B. "192.168.1.20" oder
  # "192.168.1.20:631". Leer = kein Direktdruck über CUPS.
  cups_server: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
