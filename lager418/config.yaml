name: LAGER418
version: "0.1.55"
slug: lager418
description: Werkstatt-Inventar — Lager, Projekte, Leihe
url: https://github.com/layer418/lager418-addon
arch:
  - aarch64
  - amd64
image: ghcr.io/layer418/lager418-{arch}
# s6-overlay in the base image is PID 1; Supervisor must not inject its own init
init: false
# No ports: the UI is reachable only through HA ingress, which authenticates
# the user and passes X-Remote-User-Id / X-Remote-User-Name to the app.
ingress: true
ingress_port: 8099
panel_icon: mdi:package-variant-closed
panel_title: Lager
# Sensors + an event entity are published over MQTT discovery when a broker is
# there; 'want' means the add-on still starts without one.
services:
  - mqtt:want
# Photo exports and label PDFs land somewhere the user can actually get at.
map:
  - share:rw
options:
  anthropic_key: ""
  jev_api_key: ""
  federation_enabled: false
  federation_allow_private: false
  log_level: info
schema:
  anthropic_key: password?
  anthropic_vision_model: str?
  jev_api_key: password?
  # Opens /api/federation/* to other hosts. base_url is required when enabled,
  # the API refuses to boot otherwise.
  federation_enabled: bool
  federation_base_url: url?
  federation_allow_private: bool
  log_level: list(trace|debug|info|notice|warning|error|fatal)
